<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Hub · Contact Us</title>
    <meta
      name="description"
      content="Contact the Project Hub team — questions, feedback, and privacy requests."
    />
    <link rel="icon" href="static/favicon.ico?v=3" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="static/logo_256.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="static/logo_32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/logo_16.png?v=3"
    />
    <link rel="stylesheet" href="static/style.css" />
    <link rel="stylesheet" href="static/landing.css" />
    <style>
      .contact-wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 22px 80px;
      }
      .contact-wrap h1 {
        font-size: 28px;
        margin: 10px 0 8px;
      }
      .contact-wrap p.lead {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }
      .contact-box {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px;
        margin-top: 20px;
      }
      .contact-box input,
      .contact-box textarea {
        width: 100%;
        margin-bottom: 10px;
      }
      .contact-box textarea {
        min-height: 130px;
        resize: vertical;
      }
      #contact-status {
        font-size: 13px;
        margin-top: 8px;
      }
      .direct {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .direct a {
        color: var(--accent);
      }
    </style>
  </head>
  <body class="landing">
    <nav class="topnav">
      <div class="brand">
        <img src="static/logo_128.png" alt="" class="brand-logo" />Project Hub
      </div>
      <div class="navlinks">
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy</a>
      </div>
      <div class="navcta">
        <a class="btn" href="auth.html?mode=register">Get started</a>
      </div>
    </nav>

    <main class="contact-wrap">
      <h1>Contact Us</h1>
      <p class="lead">
        Questions, feedback, or a privacy request (access, correction,
        deletion)? Send us a message and we will reply within a reasonable time.
      </p>

      <div class="contact-box">
        <form id="contact-form" novalidate>
          <input type="text" name="name" placeholder="Your name" required />
          <input
            type="text"
            name="email"
            placeholder="Your email"
            required
            autocomplete="email"
            inputmode="email"
          />
          <textarea
            name="message"
            placeholder="Your message"
            required
          ></textarea>
          <button class="btn full" type="submit" id="contact-btn">
            Send message
          </button>
        </form>
        <p id="contact-status" class="meta"></p>
        <p class="direct">
          Prefer email? Write to
          <a href="mailto:rymaszatemh@gmail.com">rymaszatemh@gmail.com</a>
        </p>
      </div>
    </main>

    <footer class="foot">
      <span class="foot-brand"
        ><img src="static/logo_128.png" alt="" class="foot-logo" />Project
        Hub</span
      >
      <span
        ><a href="auth.html">Log in</a> ·
        <a href="privacy.html">Privacy Policy</a></span
      >
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
      // Wait for the EmailJS library (loaded from CDN) before wiring the form.
      function whenEmailJsReady(cb, tries = 0) {
        if (typeof emailjs !== "undefined") return cb();
        if (tries > 50) {
          document.getElementById("contact-status").textContent =
            "Could not load the email service — check your connection and refresh.";
          return;
        }
        setTimeout(() => whenEmailJsReady(cb, tries + 1), 100);
      }
      whenEmailJsReady(() => emailjs.init({ publicKey: "ABuGsHZXiuGl4mhjF" }));

      document
        .getElementById("contact-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("contact-btn");
          const status = document.getElementById("contact-status");
          // Simple, permissive email check (the browser's type=email validation
          // is stricter than needed and rejects valid addresses like a.@b.com
          // style edge cases with a confusing message).
          const email = e.target.email.value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            status.style.color = "var(--danger)";
            status.textContent = "Please enter a valid email address.";
            e.target.email.focus();
            return;
          }
          btn.disabled = true;
          btn.textContent = "Sending…";
          status.textContent = "";
          try {
            if (typeof emailjs === "undefined")
              throw new Error("email service not loaded");
            await emailjs.send("service_nyl6qw8", "template_ploitwc", {
              name: e.target.name.value,
              email: e.target.email.value,
              message: e.target.message.value,
            });
            status.style.color = "var(--ok)";
            status.textContent = "Message sent! We will get back to you soon.";
            e.target.reset();
          } catch (err) {
            status.style.color = "var(--danger)";
            status.textContent = "Sending failed: " + (err.text || err.message);
          }
          btn.disabled = false;
          btn.textContent = "Send message";
        });
    </script>
  </body>
</html>
