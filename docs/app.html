<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Project Hub</title>
    <link rel="icon" href="static/favicon.ico?v=3" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="static/logo_256.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="static/logo_32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="static/logo_16.png?v=3"
    />
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <aside>
      <div class="logo">
        <img src="static/logo_128.png" alt="" class="side-logo" />Project Hub
      </div>
      <div class="nav active" data-v="kanban">Kanban Board</div>
      <div class="nav" data-v="tasks">My Tasks</div>
      <div class="nav" data-v="pomodoro">Pomodoro</div>
      <div class="nav" data-v="calendar">Calendar</div>
      <div class="nav" data-v="analytics">Analytics</div>
      <div class="spacer"></div>
      <div class="nav" id="tg">Light Mode</div>
      <div class="nav" id="who" style="cursor: default; opacity: 0.7"></div>
      <a class="nav logout" href="#" id="logout">Log out</a>
    </aside>
    <main>
      <header>
        <h1 id="title">Kanban Board</h1>
        <button class="btn" id="newBtn">+ New Task</button>
      </header>
      <div class="content" id="content"></div>
    </main>
    <div id="modal" class="modal-bg"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="static/config.js"></script>
    <script src="static/app.js"></script>
  </body>
</html>
